steps:
  - label: ":sparkles: Lint"
    plugins:
      - plugin-linter#v4.1.0:
          id: snyk

  - label: ":shell: Shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/**
            - lib/**

  - label: ":shell: Tests"
    plugins:
      - plugin-tester#v2.0.0:
          folders:
            - tests